name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Apple Silicon: MLX only runs there.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python -m pytest

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path app
