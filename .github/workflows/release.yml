name: Release

# Pushing a tag such as v0.2.0 builds, signs, notarizes and publishes Verbalog-0.2.0.dmg.
# One-time setup of the secrets: see RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count

      # Skips, rather than fails, when signing isn't set up yet or the release was made by hand.
      - name: Check what to do
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "$P12" ] || [ -z "$NOTARY_KEY_P8" ]; then
            echo "Skipped: the signing secrets aren't set up (see RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Skipped: release $GITHUB_REF_NAME already exists, and is left untouched." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID certificate
        if: steps.check.outputs.build == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, notarize and package
        if: steps.check.outputs.build == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Verbalog $VERSION" --generate-notes --draft \
            "build/dist/Verbalog-$VERSION.dmg" "build/dist/Verbalog-$VERSION.dmg.sha256"
